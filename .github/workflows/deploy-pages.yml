name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]

jobs:
  pages:
    # Al llamar un workflow reutilizable de otro repo, GitHub no le concede
    # automáticamente los permisos que pide — hay que declararlos aquí,
    # iguales a los que pages-deploy.yml necesita (pages: write, id-token: write).
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: corebound-labs/Commons-CI/.github/workflows/pages-deploy.yml@master
    with:
      publish-path: '.'
