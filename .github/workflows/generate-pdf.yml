name: Generar PDFs de la documentación

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Qué PDF generar'
        required: true
        type: choice
        default: all
        options:
          - all
          - ecotrack
          - packages

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: pdf
        run: npm ci

      - name: Generar PDF(s)
        working-directory: pdf
        run: node generate.mjs --target ${{ inputs.target }}

      - name: Publicar PDF(s) como artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf-${{ inputs.target }}-${{ github.run_number }}
          path: pdf/output/*.pdf
          retention-days: 90
          if-no-files-found: error
